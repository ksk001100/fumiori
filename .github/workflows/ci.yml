name: offline-poc
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r training/requirements.txt -r training/stories-requirements.txt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m pytest -q
      - run: cargo build --locked --release -p fumiori-wasm --target wasm32-unknown-unknown
