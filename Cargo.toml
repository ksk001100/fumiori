[workspace]
resolver = "2"
members = ["crates/fumiori-core", "crates/fumiori-inference", "crates/fumiori-cli", "crates/fumiori-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.10"
unicode-normalization = "0.1"
rand = "0.8.5"
candle-core = "0.9.1"
candle-nn = "0.9.1"
fumiori-core = { path = "crates/fumiori-core" }
fumiori-inference = { path = "crates/fumiori-inference" }

